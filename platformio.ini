; Elecrow CrowPanel Advance 7.0-HMI (SKU DIS02170A)
; See docs/HARDWARE.md for the reasoning behind every override below.

[platformio]
default_envs  = advance_70
extra_configs = secrets.ini       ; gitignored; copy secrets.ini.example

; ---------------------------------------------------------------------------
; Firmware for the board itself.
; ---------------------------------------------------------------------------
[env:advance_70]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino

; There is no upstream PlatformIO board for this panel. Elecrow ship a custom
; JSON, but it carries Espressif native-USB hwids on a CH340K board, which
; breaks port auto-detection. esp32-s3-devkitc-1 with explicit overrides is the
; cleaner base. Real geometry: ESP32-S3-WROOM-1-N16R8 = 16 MB QUAD flash +
; 8 MB OCTAL PSRAM.
board = esp32-s3-devkitc-1

board_build.arduino.memory_type = qio_opi      ; quad flash, OCTAL psram
board_build.psram_type          = opi
board_build.flash_mode          = qio
board_upload.flash_size         = 16MB         ; N16R8. NOT 4MB - that is the older CrowPanel 7.0 HMI.
; Two OTA app slots of 0x640000 each, bundled with the core. Moving from
; huge_app.csv rewrites the partition table, so that first flash goes over USB.
board_build.partitions          = default_16MB.csv
board_upload.maximum_size       = 6553600      ; one slot, so the size check is honest

; Bump this to release a new version. It is the only place the version lives.
custom_fw_version = 2.0.4

build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    ; NOTE: deliberately no ARDUINO_USB_CDC_ON_BOOT. This board has no native
    ; USB - GPIO19/20 are the PDM microphone - and flashes through a CH340K on
    ; GPIO43/44. Enabling CDC routes Serial to a peripheral that does not exist.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    ;
    ; Secrets come from the gitignored secrets.ini. Its values carry their own
    ; double quotes (PlatformIO keeps them), so they get only the shell's single
    ; quotes; mqtt_port is a bare number. custom_fw_version is bare, so it gets
    ; both quote levels.
    -DFW_VERSION='"${this.custom_fw_version}"'
    -DWIFI_SSID='${secrets.wifi_ssid}'
    -DWIFI_PASSWORD='${secrets.wifi_pass}'
    -DMQTT_HOST='${secrets.mqtt_host}'
    -DMQTT_PORT=${secrets.mqtt_port}
    -DMQTT_TOPIC_TEMP='${secrets.mqtt_topic_temp}'
    -DMQTT_TOPIC_HUM='${secrets.mqtt_topic_hum}'
    -DWEATHER_LATITUDE='${secrets.weather_latitude}'
    -DWEATHER_LONGITUDE='${secrets.weather_longitude}'
    -DOTA_HOSTNAME='${secrets.device_host}'
    -DOTA_PASSWORD='${secrets.ota_password}'
    ;
    ; LVGL is configured through build flags rather than a checked-in
    ; lv_conf.h, which is how Elecrow's own project does it.
    -DLV_CONF_SKIP
    -DLV_KCONFIG_IGNORE
    -DLV_COLOR_DEPTH=16
    -DLV_FONT_MONTSERRAT_16=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_36=1
    -DLV_FONT_MONTSERRAT_28=1
    -DLV_FONT_MONTSERRAT_48=1
    -DLV_MEM_SIZE=131072
    -DLV_DEF_REFR_PERIOD=33
    -DLV_USE_PERF_MONITOR=0

lib_deps =
    lovyan03/LovyanGFX @ ^1.2.0
    lvgl/lvgl @ ~9.1.0
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.0
    ; Private library: fetched over SSH, so the build needs read access to it.
    esp32-ota-kit=git+ssh://git@github.com/robominds/esp32-ota-kit.git#v1.0.0

upload_speed    = 921600
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

; ---------------------------------------------------------------------------
; Same firmware, uploaded over WiFi to a panel already running it.
;   pio run -e advance_70_ota -t upload
; ---------------------------------------------------------------------------
[env:advance_70_ota]
extends         = env:advance_70
upload_protocol = espota
upload_port     = ${secrets.device_host}.local
upload_flags    = --auth=${secrets.ota_password}

; ---------------------------------------------------------------------------
; Host tests. Builds ONLY the pure libraries - no Arduino, no hardware.
; ---------------------------------------------------------------------------
[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra
build_src_filter = -<*>
lib_compat_mode = off
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0

; ---------------------------------------------------------------------------
; Throwaway diagnostic: the real-time clock and the microSD card, neither of
; which the application touches. Does not start the panel.
;   pio run -e diag -t upload          # run it
;   pio run -e advance_70 -t upload    # put the application back
; ---------------------------------------------------------------------------
[env:diag]
extends          = env:advance_70
build_src_filter = -<*> +<../tools/diag/main.cpp>
build_flags      = -DBOARD_HAS_PSRAM -I src
lib_deps         = Wire
                   SPI
                   SD
